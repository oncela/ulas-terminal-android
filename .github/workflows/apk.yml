# Her gönderimde APK derlenir; Actions sayfasından "UlasTerminal" dosyası indirilir.
# "v1.0.1" gibi etiket gönderilirse sürüm sayfasına (Releases) da eklenir.
name: APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Android SDK GitHub sunucularında hazır kurulu gelir (ANDROID_HOME)
      - name: Derle
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee derleme.log
      # Derleme kırılırsa kayıt "derleme-log" dalına yazılır (sunucu okuyup düzeltebilsin)
      - name: Hata kaydını yaz
        if: failure()
        run: |
          mkdir kayit && cp derleme.log kayit/ 2>/dev/null || echo "derleme.log yok" > kayit/derleme.log
          cd kayit
          git init -q -b derleme-log
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Derleme hatası (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" derleme-log
      - uses: actions/upload-artifact@v4
        with:
          name: UlasTerminal
          path: app/build/outputs/apk/release/*.apk
      # Sunucu APK'yı buradan kendisi alır (depo gizli; sunucu yalnız git ile okuyabilir)
      - name: APK dalına koy
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir dagitim && cp app/build/outputs/apk/release/*.apk dagitim/UlasTerminal.apk
          grep -oE "versionName ['\"][^'\"]+" app/build.gradle | grep -oE '[0-9][0-9A-Za-z.-]*' > dagitim/surum.txt
          cd dagitim
          git init -q -b apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "APK $(cat surum.txt) (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
      - name: Sürüm sayfasına ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
