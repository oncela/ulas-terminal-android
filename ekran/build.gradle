// Ulaş Ekran: banko / depo TV kutusu için bilgi ekranı (yalnız ekran; okuyucu, kamera, Bluetooth yok)
apply plugin: 'com.android.application'

android {
    namespace 'com.ulasgrup.ekran'
    compileSdkVersion 34
    defaultConfig {
        applicationId 'com.ulasgrup.ekran'
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        // El terminali uygulamasıyla aynı anahtar (imza/); depo herkese açık yapılmamalı
        ulas {
            def p = new Properties()
            def f = rootProject.file('imza/imza.properties')
            if (f.exists()) f.withInputStream { p.load(it) }
            storeFile rootProject.file('imza/ulas-terminal.p12')
            storeType 'pkcs12'
            storePassword p.getProperty('ULAS_IMZA_SIFRE', '')
            keyAlias 'ulas'
            keyPassword p.getProperty('ULAS_IMZA_SIFRE', '')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ulas
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = "UlasEkran-${variant.versionName}-${variant.name}.apk" }
    }
}
