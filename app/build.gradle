apply plugin: 'com.android.application'

android {
    namespace 'com.ulasgrup.terminal'
    compileSdkVersion 34
    defaultConfig {
        applicationId 'com.ulasgrup.terminal'
        // Nordic ID HH83/HH85 Android 9 (API 28); daha eski cihazlar da çalışır
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 4
        versionName '1.1.0'
    }
    signingConfigs {
        // Sabit imza: yeni sürüm eskisinin üstüne kurulabilsin. Anahtar özel depoda (imza/); depo herkese açık yapılmamalı.
        ulas {
            def p = new Properties()
            def f = rootProject.file('imza/imza.properties')
            if (f.exists()) f.withInputStream { p.load(it) }
            storeFile rootProject.file('imza/ulas-terminal.p12')
            storeType 'pkcs12'
            storePassword p.getProperty('ULAS_IMZA_SIFRE', '')
            keyAlias 'ulas'
            keyPassword p.getProperty('ULAS_IMZA_SIFRE', '')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ulas
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = "UlasTerminal-${variant.versionName}-${variant.name}.apk" }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // NurApiAndroid'in cihaz arama ekranı Bluetooth tarayıcıya bağlı
    implementation 'no.nordicsemi.android.support.v18:scanner:1.4.0'
    implementation files('libs/NurApiAndroid.aar')
    implementation files('libs/NurApi.jar')
}
